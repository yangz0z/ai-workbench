{id:'agent',title:'AI 도구',sub:'Claude Code · Codex',x:300,y:270,w:230,h:85,body:'스킬의 지침을 읽고 코드·자료를 확인해 작업합니다. 스킬은 별도 서버가 아니라 AI가 참고하는 제작·실행 지침입니다.',note:'각 스킬은 독립 설치할 수 있습니다. 아래 연결은 AI가 각 스킬을 사용하는 관계입니다.',source:'README.md · skills/*/SKILL.md'},
{id:'web',title:'web-artifacts',sub:'설계 설명 · 도식 제작',x:635,y:80,w:255,h:85,body:'코드·스키마·테스트에서 핵심 설계를 추려 인터랙티브 HTML을 만듭니다. 큰 도식, 짧은 상세 패널과 단계별 탐색을 기본으로 합니다.',note:'현재 보고 있는 이 파일이 제작 방식의 샘플입니다. 자동 게시 기능은 포함하지 않습니다.',source:'skills/web-artifacts/SKILL.md'},
{id:'prototype',title:'notion-prototype',sub:'화면 기획 · HTML 게시',x:635,y:270,w:255,h:85,body:'AI가 클릭형 HTML을 작성하고, 동봉 CLI가 파일 검사·Notion 업로드·임베드 교체를 담당합니다.',note:'게시를 요청한 경우에만 Notion에 반영합니다. 실제 서비스의 로그인·저장 기능을 구현하는 도구는 아닙니다.',source:'skills/notion-prototype/SKILL.md'},
{id:'markdown',title:'markdown-notion',sub:'Markdown 게시 · 갱신',x:635,y:460,w:255,h:85,body:'로컬 Markdown을 원본으로 두고 Notion 데이터베이스 항목의 본문과 속성을 게시·갱신합니다.',note:'notion-prototype과 같은 페이지에 번갈아 게시하지 않고, 별도 페이지에서 링크로 연결합니다.',source:'skills/markdown-notion/SKILL.md'},
{id:'html',title:'로컬 HTML',sub:'설계 도식 + 수정용 소스',x:1000,y:80,w:260,h:85,body:'한 파일로 열 수 있는 설계 설명 아티팩트와 수정 가능한 소스를 남깁니다. 웹 호스팅 없이 파일을 전달할 수 있습니다.',note:'이 예제는 HTML 자체가 수정용 원본입니다. 별도 빌드나 패키지 설치가 필요하지 않습니다.',source:'skills/web-artifacts/references/build.md'},

{id:'page',title:'Notion 문서',sub:'데이터베이스 항목',x:1000,y:460,w:260,h:85,body:'변환한 Markdown 본문과 매핑한 속성을 Notion 데이터베이스 항목에 반영합니다.',note:'사용자 자신의 Notion 인증이 필요합니다. 문서와 원격 페이지의 연결·해시·게시 상태를 로컬에 관리합니다.',source:'skills/markdown-notion/references/usage.md'}

{id:'choose',title:'도식 선정',sub:'질문에 맞는 표현 선택',x:370,y:162,w:560,h:72,body:'관계는 아키텍처·ERD, 호출 순서는 시퀀스, 조건 분기는 플로우차트처럼 질문에 맞는 도식을 고릅니다.',note:'이 저장소에는 설명할 업무 DB가 없어 샘플에 ERD를 억지로 넣지 않았습니다.',source:'references/diagrams.md'},
{id:'build',title:'HTML 제작',sub:'도식 · 선택 · 상세 설명 연결',x:370,y:284,w:560,h:72,body:'무채색 화면에 현재 선택만 연노랑으로 표시합니다. 노드를 선택하면 도식 강조와 상세 설명이 함께 바뀝니다.',note:'선택한 노드의 직접 연결만 강조합니다. 단계 버튼은 설명 길이와 무관하게 같은 위치에 유지합니다.',source:'references/interactions.md · assets/theme.css'},

{id:'deliver',title:'파일 전달',sub:'HTML + 수정 가능한 원본',x:370,y:528,w:560,h:72,body:'완성 HTML과 수정 가능한 원본을 프로젝트 산출물 위치에 보관하고, 파일 경로와 여는 방법을 안내합니다.',note:'브라우저 창을 자동으로 띄우지 않습니다. 공개 배포나 외부 업로드는 별도 요청이 있을 때 진행합니다.',source:'SKILL.md · references/build.md'}

const connections=[['user','agent','요청'],['agent','web','설계 설명'],['agent','prototype','화면 기획'],['agent','markdown','문서 게시'],['web','html','제작'],['prototype','embed','게시 요청 시'],['markdown','page','게시 요청 시']];
let view='overview',selected='web',step=0,zoom=1;

function svgElement(tag,attrs={},text){const el=document.createElementNS(ns,tag);Object.entries(attrs).forEach(([k,v])=>el.setAttribute(k,String(v)));if(text!==undefined)el.textContent=text;return el}
function draw(){
 const chart=$('diagram'),list=view==='overview'?overview:steps,current=view==='overview'?selected:steps[step].id;
 const edges=view==='overview'?connections:steps.slice(1).map((n,i)=>[steps[i].id,n.id,'']);
 const adjacent=new Set([current]);edges.forEach(([from,to])=>{if(from===current||to===current){adjacent.add(from);adjacent.add(to)}});
 chart.replaceChildren();chart.setAttribute('viewBox','0 0 1300 650');chart.setAttribute('aria-label',view==='overview'?'전체 구성':'아티팩트 제작 흐름');
 const defs=svgElement('defs'),marker=svgElement('marker',{id:'arrow',viewBox:'0 0 10 10',refX:9,refY:5,markerWidth:7,markerHeight:7,orient:'auto'});marker.append(svgElement('path',{d:'M1 1 L9 5 L1 9',fill:'none',stroke:'#777','stroke-width':1.3}));defs.append(marker);chart.append(defs);
 if(view==='overview'){[[40,'요청'],[300,'실행 주체'],[635,'독립 설치 가능한 스킬'],[1000,'결과물']].forEach(([x,text])=>chart.append(svgElement('text',{x,y:35,class:'label'},text)))}
 edges.sort((a,b)=>Number(a[0]===current||a[1]===current)-Number(b[0]===current||b[1]===current)).forEach(([from,to,label])=>{const a=list.find(n=>n.id===from),b=list.find(n=>n.id===to);const active=view==='workflow'||from===current||to===current;const g=svgElement('g',{class:'edge'+(active?'':' dim'),'data-from':from,'data-to':to});let d,x,y;if(view==='overview'){const sx=a.x+a.w,sy=a.y+a.h/2,ex=b.x,ey=b.y+b.h/2;d=`M${sx} ${sy} C${sx+(ex-sx)/2} ${sy} ${ex-(ex-sx)/2} ${ey} ${ex} ${ey}`;x=(sx+ex)/2;y=(sy+ey)/2-12}else{d=`M${a.x+a.w/2} ${a.y+a.h} L${b.x+b.w/2} ${b.y}`;x=0;y=0}g.append(svgElement('path',{d,'marker-end':'url(#arrow)'}));if(label)g.append(svgElement('text',{x,y,'text-anchor':'middle'},label));chart.append(g)});
 list.forEach((n,i)=>{const g=svgElement('g',{class:'node'+(view==='overview'&&!adjacent.has(n.id)?' dim':''),role:'button',tabindex:0,'aria-label':n.title,'aria-pressed':n.id===current,'data-id':n.id,'data-current':n.id===current});g.append(svgElement('rect',{x:n.x,y:n.y,width:n.w,height:n.h,rx:13}));g.append(svgElement('text',{x:n.x+n.w/2,y:n.y+32,'text-anchor':'middle'},n.title));g.append(svgElement('text',{x:n.x+n.w/2,y:n.y+58,'text-anchor':'middle',class:'sub'},n.sub));const select=()=>{if(view==='overview')selected=n.id;else step=i;draw();chart.querySelector(`[data-id="${n.id}"]`).focus({preventScroll:true})};g.addEventListener('click',select);g.addEventListener('keydown',e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();select()}});chart.append(g)});
 const item=list.find(n=>n.id===current);$('detail-title').textContent=item.title;$('detail-body').textContent=item.body;$('detail-note').textContent=item.note;$('detail-source').textContent='근거 · '+(view==='workflow'?'skills/web-artifacts/':'')+item.source;
 $('stepper').hidden=view!=='workflow';$('step-count').textContent=`${step+1} / ${steps.length}`;$('prev').disabled=step===0;$('next').disabled=step===steps.length-1;$('reset').disabled=step===0;
 $('title').textContent=view==='overview'?'전체 구성':'아티팩트 제작 흐름';$('subtitle').textContent=view==='overview'?'사용자 요청 → AI 도구 → 독립 스킬 → 결과물 · 노드를 눌러 연결 관계를 확인하세요.':'web-artifacts의 제작 절차 · 다음 단계를 누르거나 노드를 직접 선택하세요.';$('topic-number').textContent=view==='overview'?'01 / OVERVIEW':'02 / WORKFLOW';$('diagram-title').textContent=view==='overview'?'스킬과 결과물':'자료 확인부터 파일 전달까지';$('caption').textContent=view==='overview'?'연노랑: 현재 선택 · 선명한 요소: 직접 연결 · 흐린 요소: 다른 관계':'연노랑: 현재 단계 · 검증에서 문제를 발견하면 해당 단계 수정 후 재검증';size();

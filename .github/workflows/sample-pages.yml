name: Publish artifact sample
on:
  push:
    branches: [main]
    paths:
      - skills/web-artifacts/assets/example.html
      - .github/workflows/sample-pages.yml
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  deploy:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - name: Prepare sample only
        run: |
          mkdir -p _site
          cp skills/web-artifacts/assets/example.html _site/index.html
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - name: Deploy sample
        id: deployment
        uses: actions/deploy-pages@v4
